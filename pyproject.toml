[project]
name = "agents"
version = "0.1.0"
description = "Canonical local registry for non-sensitive AI agent definitions"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
# skills/blind-review stripper grammars; keep equal to its PEP 723 header.
dev = [
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-c==0.24.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-scala==0.26.2",
    "tree-sitter-swift==0.7.4",
    "tree-sitter-groovy==0.1.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-css==0.25.0",
    "tree-sitter-json==0.24.8",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-make==1.1.1",
    "tree-sitter-dockerfile==0.2.0",
    "tree-sitter-toml==0.7.0",
    "tree-sitter-yaml==0.7.2",
    "tree-sitter-hcl==1.2.0",
    "tree-sitter-nix==0.1.0",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-lua==0.5.0",
    "tree-sitter-sql==0.3.11",
    "tree-sitter-html==0.23.2",
    "tree-sitter-xml==0.7.0",
]

[project.scripts]
agent-registry = "agent_registry.cli:main"
