schema_version = 1

# No credentials belong in this file. Fill in platform IDs after an authenticated
# connection is available. Live league settings override provisional profile values.

[statistics]
primary_source = "nflverse-weekly-player-stats"
primary_source_url = "https://github.com/nflverse/nflverse-data/releases"
primary_asset = "weekly player stats"
reconciliation_source = "platform-reported fantasy points"
freshness_policy = "Record the retrieval time and use the latest available release."

[settings_sources.yahoo]
description = "Authenticated Yahoo Fantasy league settings and team state."
documentation = "https://developer.yahoo.com/fantasysports/guide/"
mutation_requirement = "Fantasy Sports read/write authorization"

[settings_sources.sleeper]
description = "Sleeper league settings and team state from the league resource."
resource = "GET /v1/league/{league_id}"
settings_fields = ["settings", "scoring_settings", "roster_positions"]
documentation = "https://docs.sleeper.com/"
mutation_requirement = "Official API is read-only; use an authenticated UI or write-capable integration."

[point_templates.normalized_v1]
formula = "sum(raw_stat * points_per_unit) + event_points + threshold_points"
authority = "Live league scoring settings"
missing_rule_policy = "Block exact calculation and report the missing rule; do not use generic defaults."

[leagues."chi-town-yahoo"]
display_name = "Chi-Town Yahoo"
platform = "yahoo"
league_format = "redraft"
tenure = "10+ seasons"
membership = "Long-running league with few manager changes"
strategy = "Win-now redraft; use stable league tendencies as secondary evidence."
settings_source = "yahoo"
statistics_source = "nflverse-weekly-player-stats"
point_template = "normalized_v1"
settings_status = "partial"

[leagues."chi-town-yahoo".identifiers]
league_key = ""
team_key = ""

[leagues."chi-town-yahoo".known_rules]
baseline = "mostly-standard"
reception_points = 0.5

[leagues."chi-town-yahoo".unknown_rules]
fields = ["remaining scoring modifiers", "roster positions", "transaction rules"]

[leagues."workplace-sleeper-keeper"]
display_name = "Workplace Sleeper Keeper"
platform = "sleeper"
league_format = "keeper"
seasons_in_league = 3
membership = "Workplace league"
strategy = "Balance weekly points with keeper eligibility, retention cost, and future value."
settings_source = "sleeper"
statistics_source = "nflverse-weekly-player-stats"
point_template = "normalized_v1"
settings_status = "unverified-custom"

[leagues."workplace-sleeper-keeper".identifiers]
league_id = ""
roster_id = ""

[leagues."workplace-sleeper-keeper".known_rules]
baseline = "mostly-standard-custom"

[leagues."workplace-sleeper-keeper".unknown_rules]
fields = ["reception scoring", "custom scoring modifiers", "keeper eligibility", "keeper retention costs"]

[leagues."workplace-sleeper-redraft"]
display_name = "Workplace Sleeper Redraft"
platform = "sleeper"
league_format = "redraft"
membership = "Workplace league"
strategy = "Win-now redraft; do not assume PPR level until live settings confirm it."
settings_source = "sleeper"
statistics_source = "nflverse-weekly-player-stats"
point_template = "normalized_v1"
settings_status = "ppr-unverified"

[leagues."workplace-sleeper-redraft".identifiers]
league_id = ""
roster_id = ""

[leagues."workplace-sleeper-redraft".known_rules]
baseline = "mostly-standard"

[leagues."workplace-sleeper-redraft".unknown_rules]
fields = ["reception scoring", "remaining scoring modifiers", "roster positions", "transaction rules"]
candidate_reception_points = [0.5, 1.0]
